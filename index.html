<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="案件查詢">
<meta name="robots" content="noindex, nofollow">
<title>業務案件查詢</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f3f4f6; overflow: hidden; }
  #app {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%; border: 0; display: block; background: #f3f4f6;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 16px "Microsoft JhengHei", "PingFang TC", sans-serif; color: #666;
  }
</style>
</head>
<body>
<div id="loading">載入中…</div>
<iframe id="app" title="業務案件查詢" allow="clipboard-write"></iframe>
<script>
  // ↓↓↓ 把這裡換成你的網頁應用程式網址（Apps Script「部署」後拿到、結尾是 /exec 的那個）
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzcR9fR-u6bxzx33Ll4wV9SXg9473eXda9lwZOdu1p0gEVimC72Xxpkbi9pFSnfd909Rw/exec';
  // ↑↑↑

  const f = document.getElementById('app');
  f.addEventListener('load', () => { document.getElementById('loading').style.display = 'none'; });
  f.src = APP_URL;
</script>
</body>
</html>
